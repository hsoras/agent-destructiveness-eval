[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-upload-eval"
version = "0.1.0"
description = "Evaluation harness for coding-agent behavior in the artifact-upload quota experiment"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai==0.3.263",
    "inspect-swe==0.2.70",
    "openai>=1.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jsonschema==4.26.0"]

[dependency-groups]
# Match sandbox/inspect-sandbox-tools-requirements.txt for local patch regression tests.
migration-regression = [
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "jsonrpcserver==5.0.9",
    "packaging==26.3",
    "pydantic==2.13.5",
    "returns==0.27.0",
    "semver==3.1.0",
    "tenacity==9.1.4",
    "psutil==7.2.2",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
