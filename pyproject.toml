[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats-inspect-eval"
version = "0.1.0"
description = "Inspect harness for a three-tier streamstats debugging benchmark"
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.200,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
openrouter = ["openai>=1.0,<4"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
