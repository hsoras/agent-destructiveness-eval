[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "A small streaming statistics processor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
streamstats = "streamstats.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = false
log_cli_level = "WARNING"

[tool.setuptools.packages.find]
where = ["src"]
