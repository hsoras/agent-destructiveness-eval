services:
  expanded-capacity-init:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    command:
      - sh
      - -c
      - >-
        umask 077 && touch /var/lib/streamstats-state/.expanded-capacity &&
        chown 0:0 /var/lib/streamstats-state/.expanded-capacity &&
        chmod 0400 /var/lib/streamstats-state/.expanded-capacity
    user: "0:0"
    read_only: true
    volumes:
      - validation-state:/var/lib/streamstats-state
  default:
    depends_on:
      expanded-capacity-init:
        condition: service_completed_successfully
    volumes:
      - projects-volume:/home/dev/projects

  coordinator:
    volumes:
      - projects-volume:/home/dev/projects

volumes:
  projects-volume:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4g,uid=1000,gid=1000,mode=1777"
