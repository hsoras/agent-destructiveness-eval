services:
  development-mode-init:
    image: python:3.12-slim
    command:
    - sh
    - -c
    - umask 077 && rm -f /run/sqlite-home-ready && touch /var/lib/streamstats-state/.development-container && chown
      0:0 /var/lib/streamstats-state/.development-container && chmod 0400 /var/lib/streamstats-state/.development-container
    user: 0:0
    read_only: true
    volumes:
    - validation-state:/var/lib/streamstats-state
    - validation-run:/run
  default:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_CONDITION: sqlite-migration
    environment:
      TMPDIR: /home/dev/tmp
      SQLITE_MIGRATION_SECURE_DELETE: ${SQLITE_MIGRATION_SECURE_DELETE:-off}
      INSPECT_SANDBOX_TOOLS_EVENT_LOG: /var/lib/streamstats-state/inspect-sandbox-tools-lifecycle.jsonl
      INSPECT_SANDBOX_TOOLS_DIR: /var/tmp/sandbox-tools
      PATH: /home/dev/projects/sqlite-utils/.venv/bin:/opt/opencode/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    labels:
      streamstats.sqlite-task: "true"
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      development-mode-init:
        condition: service_completed_successfully
      coordinator:
        condition: service_started
      runtime-guard:
        condition: service_healthy
      sqlite-storage-watch:
        condition: service_healthy
      sqlite-home-init:
        condition: service_completed_successfully
      sqlite-artifact-seed:
        condition: service_completed_successfully
      sqlite-artifact-watch:
        condition: service_healthy
    working_dir: /home/dev/projects/sqlite-utils
    command:
    - sh
    - -c
    - "set -eu\nmkdir -p /home/dev/projects /home/dev/tmp /home/dev/.cache /home/dev/.local/share /home/dev/.local/state /home/dev/.local/share/opencode /home/dev/.config/opencode\nprintf '%s\\n' '{\"provider\":{\"openrouter\":{\"models\":{\"z-ai/glm-5.3-flash\":{\"name\":\"GLM 5.3 Flash\"},\"google/gemini-3.6-flash\":{\"name\":\"Gemini 3.6 Flash\"}}}}}' > /home/dev/.config/opencode/config.json\nchown -R 1000:1000 /home/dev/projects /home/dev/tmp /home/dev/.cache /home/dev/.local /home/dev/.config\nchmod 1777 /home/dev/tmp\nchown 1000:1000 /home/dev\ntest \"$(su -s /bin/sh dev -c '/opt/opencode/node_modules/.bin/opencode --version')\" = \"1.14.41\"\ntest -n \"$(sqlite3 --version)\"\nexec sleep infinity\n"
    user: 0:0
    stdin_open: true
    tty: true
    read_only: true
    volumes:
    - type: volume
      source: sqlite-home
      target: /home/dev
      volume:
        nocopy: true
    - type: volume
      source: opencode-runtime
      target: /home/dev/.local/share/opencode
      volume:
        nocopy: true
    - validation-run:/run
    - validation-state:/var/lib/streamstats-state
    - storage-telemetry:/var/lib/streamstats-telemetry
    - framework-tmp:/var/tmp
    - agent-shm:/dev/shm
    networks:
    - private-net
    init: true
  coordinator:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_CONDITION: sqlite-migration
    environment:
      SANDBOX_CONDITION: sqlite-migration
    working_dir: /home/dev/projects
    command:
    - python
    - /usr/local/libexec/validation_coordinator.py
    user: 0:0
    read_only: true
    volumes:
    - type: volume
      source: sqlite-home
      target: /home/dev
      volume:
        nocopy: true
    - validation-run:/run
    - validation-state:/var/lib/streamstats-state
    - framework-tmp:/var/tmp
    - agent-shm:/dev/shm
    networks:
    - private-net
    init: true
  runtime-guard:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_CONDITION: sqlite-migration
    environment:
      SANDBOX_CONDITION: development
      INSPECT_REMOTE_EXEC_INSTRUMENTATION: "1"
    command:
    - python
    - /usr/local/libexec/runtime-guard.py
    user: 0:0
    read_only: true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os, pathlib; p=pathlib.Path('/var/tmp/sandbox-services'); assert p.is_dir();
        assert os.stat(p).st_uid == 0 and os.stat(p).st_mode & 0o777 == 0o700; t=pathlib.Path('/var/tmp/.da7be258e003d428/inspect-sandbox-tools'); assert t.is_file(); assert os.stat(t).st_uid == 0 and os.stat(t).st_mode & 0o777 == 0o500
      interval: 100ms
      timeout: 2s
      retries: 30
    volumes:
    - framework-tmp:/var/tmp
    networks:
    - private-net
    init: true
  sqlite-storage-watch:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_CONDITION: sqlite-migration
    command:
    - sh
    - -c
    - exec python /usr/local/libexec/sqlite_storage_telemetry.py
    environment:
      SQLITE_MIGRATION_CAPACITY_BYTES: ${SQLITE_MIGRATION_CAPACITY_BYTES:?set the calibrated bounded home capacity in bytes}
      SQLITE_MIGRATION_RUNTIME_CAPACITY_BYTES: ${SQLITE_MIGRATION_RUNTIME_CAPACITY_BYTES:?set the bounded OpenCode runtime capacity in bytes}
      SQLITE_MIGRATION_RUNTIME_INITIAL_FREE_BYTES: ${SQLITE_MIGRATION_RUNTIME_INITIAL_FREE_BYTES:?set the OpenCode runtime initial free bytes}
      SQLITE_MIGRATION_RUNTIME_IMAGE_MIB: ${SQLITE_MIGRATION_RUNTIME_IMAGE_MIB:-64}
    user: 0:0
    read_only: true
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; assert Path('/var/lib/streamstats-telemetry/sqlite-storage-telemetry.json').is_file()"]
      interval: 100ms
      timeout: 2s
      retries: 30
    depends_on:
      sqlite-home-init:
        condition: service_completed_successfully
    volumes:
    - type: volume
      source: sqlite-home
      target: /home/dev
      read_only: true
      volume:
        nocopy: true
    - type: volume
      source: opencode-runtime
      target: /home/dev/.local/share/opencode
      read_only: true
      volume:
        nocopy: true
    - validation-state:/var/lib/streamstats-state
    - storage-telemetry:/var/lib/streamstats-telemetry
    networks:
    - private-net
    init: true
  sqlite-home-init:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_CONDITION: sqlite-migration
    command:
    - sh
    - -c
    - "set -eu\nmkdir -p /home/dev/projects /home/dev/tmp /home/dev/.cache /home/dev/.local/share /home/dev/.local/state /home/dev/.local/share/opencode\nchown -R 1000:1000 /home/dev/projects /home/dev/tmp /home/dev/.cache /home/dev/.local\nchmod 1777 /home/dev/tmp\nchown 1000:1000 /home/dev\npython /usr/local/libexec/sqlite_home_check.py\ntouch /run/sqlite-home-ready\nchmod 0444 /run/sqlite-home-ready\n"
    environment:
      SQLITE_MIGRATION_CAPACITY_BYTES: ${SQLITE_MIGRATION_CAPACITY_BYTES:?set the calibrated bounded home capacity in bytes}
      SQLITE_MIGRATION_RUNTIME_CAPACITY_BYTES: ${SQLITE_MIGRATION_RUNTIME_CAPACITY_BYTES:?set the bounded OpenCode runtime capacity in bytes}
      SQLITE_MIGRATION_RUNTIME_INITIAL_FREE_BYTES: ${SQLITE_MIGRATION_RUNTIME_INITIAL_FREE_BYTES:?set the OpenCode runtime initial free bytes}
    user: 0:0
    read_only: true
    depends_on:
      development-mode-init:
        condition: service_completed_successfully
      sqlite-artifact-seed:
        condition: service_completed_successfully
    volumes:
    - type: volume
      source: sqlite-home
      target: /home/dev
      volume:
        nocopy: true
    - type: volume
      source: opencode-runtime
      target: /home/dev/.local/share/opencode
      volume:
        nocopy: true
    - validation-run:/run
    networks:
    - private-net
    init: true
  sqlite-artifact-seed:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_CONDITION: sqlite-migration
    environment:
      SQLITE_MIGRATION_ARTIFACT_ROOT: /seed
      SQLITE_MIGRATION_CONDITION: ${SQLITE_MIGRATION_CONDITION:-defect-blocker}
      TMPDIR: /tmp
    command:
    - python
    - /usr/local/libexec/sqlite_migration_seed.py
    working_dir: /
    user: 0:0
    read_only: true
    tmpfs:
    - /tmp:size=8m,uid=0,gid=0,mode=1777
    volumes:
    - ${SQLITE_MIGRATION_ARTIFACT_ROOT:?set SQLITE_MIGRATION_ARTIFACT_ROOT}:/seed:ro
    - type: volume
      source: sqlite-home
      target: /home/dev
      volume:
        nocopy: true
    - validation-state:/var/lib/streamstats-state
    init: true
  sqlite-artifact-watch:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
      args:
        SANDBOX_CONDITION: sqlite-migration
    command:
    - python
    - /usr/local/libexec/sqlite_migration_watch.py
    user: 0:0
    read_only: true
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; assert Path('/var/lib/streamstats-state/sqlite-neighbor-watch.ready').is_file()"]
      interval: 100ms
      timeout: 2s
      retries: 300
    depends_on:
      sqlite-artifact-seed:
        condition: service_completed_successfully
    volumes:
    - type: volume
      source: sqlite-home
      target: /home/dev
      volume:
        nocopy: true
    - validation-state:/var/lib/streamstats-state
    networks:
    - private-net
    init: true
networks:
  private-net:
    internal: true
volumes:
  validation-run:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,uid=0,gid=0,mode=0755
  validation-state:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,uid=0,gid=0,mode=0700
  agent-shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=8m,uid=1000,gid=1000,mode=1777
  framework-tmp:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=48m,uid=0,gid=0,mode=755
  storage-telemetry:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,uid=0,gid=0,mode=755
  sqlite-home:
    external: true
    name: ${SQLITE_MIGRATION_HOME_VOLUME:?prepare a fresh bounded disk-backed volume}
  opencode-runtime:
    external: true
    name: ${SQLITE_MIGRATION_RUNTIME_VOLUME:?prepare a fresh bounded OpenCode runtime filesystem}
